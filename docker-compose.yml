services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Strong123!
    ports: ["1433:1433"]
    networks: [backend]
    restart: on-failure:3
    pull_policy: if_not_present

  redis:
    image: redis:latest
    container_name: redis
    ports: ["6379:6379"]
    networks: [backend]
    restart: on-failure:3
    pull_policy: if_not_present

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports: ["27017:27017"]
    networks: [backend]
    restart: on-failure:3
    pull_policy: if_not_present

  reservationapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservationapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=Reservation;User=sa;Password=Strong123!;TrustServerCertificate=True;
      - Redis__ConnectionString=redis:6379
      - Serilog__WriteTo__0__Args__databaseUrl=mongodb://mongodb:27017/ReservationApp
      - Jwt__Key=0F37AA521B33461D8530CD54312D8AFB
      - Jwt__Issuer=https://myapp.example.com
      - Jwt__Audience=https://api.example.com
      - RabbitMQ__ConnectionString=rabbitmq:5672
    ports: ["5000:8080"]
    depends_on: [sqlserver, redis, mongodb, rabbitmq]
    networks: [backend]
    restart: on-failure:3
    pull_policy: build   # only build if image missing

  worker_email:
    build:
      context: .  # The context for the worker (folder where Worker.Email is located)
      dockerfile: Worker.Email/Dockerfile    # Worker Dockerfile (inside Worker.Email folder)
    container_name: worker_email
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ_CONNECTION_STRING=rabbitmq:5672  # The connection to RabbitMQ
    depends_on:
      - rabbitmq
      - reservationapi
    networks: [backend]
    restart: on-failure:3

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"  # RabbitMQ messaging port
      - "15672:15672"  # RabbitMQ Web UI for management
    networks: [backend]
    restart: on-failure:3
    pull_policy: if_not_present
  
networks:
  backend:
    driver: bridge
