x-dev:
  sa_password: &sa_password "Strong123!"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: *sa_password
      MSSQL_PID: "Developer"
    ports: ["1433:1433"]
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks: [backend]
    restart: on-failure:3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bash -c ''timeout 1 bash -c "</dev/tcp/localhost/1433"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:latest
    container_name: redis
    ports: ["6379:6379"]
    networks: [backend]
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports: ["27018:27017"]
    volumes:
      - mongodb-data:/data/db
    networks: [backend]
    restart: on-failure:3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "db.adminCommand(''ping'').ok" | grep -q 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: AppPass123!
    ports: ["5672:5672", "15672:15672"]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [backend]
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  reservationapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservationapi
    environment:
      DOTNET_ENVIRONMENT: "Docker"
      ASPNETCORE_ENVIRONMENT: "Docker"
      ASPNETCORE_URLS: "http://+:8080"
    ports: ["5000:8080"]
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./logs/reservationapi:/app/Logs
    networks: [backend]
    restart: on-failure:3

  worker_email:
    build:
      context: .
      dockerfile: Worker.Email/Dockerfile
    container_name: worker_email
    environment:
      DOTNET_ENVIRONMENT: "Docker"
      ASPNETCORE_ENVIRONMENT: "Docker"
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./logs/worker_email:/app/Logs
    networks: [backend]
    restart: on-failure:3

networks:
  backend:
    driver: bridge

volumes:
  sqlserver-data:
  mongodb-data:
  rabbitmq-data:
